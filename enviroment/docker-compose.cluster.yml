version: "3.8"

services:
  redis-node-1:
    image: redis:7-alpine
    container_name: redis-cluster-node-1
    command: >
      redis-server /usr/local/etc/redis/redis.conf
      --port 6379
      --cluster-enabled yes
      --cluster-config-file nodes.conf
      --cluster-node-timeout 5000
      --appendonly yes
      --save ""
    ports:
      - "6381:6379"
      - "16381:16379"
    volumes:
      - ./cluster/node1/data:/data
      - ./cluster/node1/redis.conf:/usr/local/etc/redis/redis.conf
    networks:
      redis-cluster:
        ipv4_address: 172.22.0.11

  redis-node-2:
    image: redis:7-alpine
    container_name: redis-cluster-node-2
    command: >
      redis-server /usr/local/etc/redis/redis.conf
