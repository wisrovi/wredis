version: "3.8"

services:
  redis-master:
    image: redis:7-alpine
    container_name: redis-sentinel-master
    command: >
      redis-server /usr/local/etc/redis/redis.conf
      --port 6379
      --appendonly yes
      --save ""
    ports:
      - "6390:6379"
    volumes:
      - ./sentinel/master/data:/data
      - ./sentinel/master/redis.conf:/usr/local/etc/redis/redis.conf
    networks:
      redis-sentinel:
        ipv4_address: 172.23.0.11

  redis-replica-1:
    image: redis:7-alpine
    container_name: redis-sentinel-replica-1
    command: >
      redis-server /usr/local/etc/redis/redis.conf
      --port 6379
      --replicaof redis-sentinel-master 6379
      --appendonly yes
      --save ""
    ports:
      - "6391:6379"
    volumes:
      - ./sentinel/replica1/data:/data
      - ./sentinel/replica1/redis.conf:/usr/local/etc/redis/redis.conf
    depends_on:
      - redis-master
    networks:
      redis-sentinel:
        ipv4_address: 172.23.0.12

  redis-replica-2:
    image: redis:7-alpine
    container_name: redis-sentinel-replica-2
    command: >
      redis-server /usr/local/etc/redis/redis.conf
      --port 6379
      --replicaof redis-sentinel-master 6379
      --appendonly yes
      --save ""
    ports:
      - "6392:6379"
    volumes:
      - ./sentinel/replica2/data:/data
      - ./sentinel/replica2/redis.conf:/usr/local/etc/redis/redis.conf
    depends_on:
      - redis-master
    networks:
      redis-sentinel:
        ipv4_address: 172.23.0.13

  sentinel-1:
    image: redis:7-alpine
    container_name: redis-sentinel-1
    command: >
      redis-sentinel /usr/local/etc/redis/sentinel.conf
    ports:
      - "26379:26379"
    volumes:
      - ./sentinel/sentinel1/sentinel.conf:/usr/local/etc/redis/sentinel.conf
    depends_on:
      - redis-master
      - redis-replica-1
      - redis-replica-2
    networks:
      redis-sentinel:
        ipv4_address: 172.23.0.21

  sentinel-2:
    image: redis:7-alpine
    container_name: redis-sentinel-2
    command: >
      redis-sentinel /usr/local/etc/redis/sentinel.conf
    ports:
      - "26380:26379"
    volumes:
      - ./sentinel/sentinel2/sentinel.conf:/usr/local/etc/redis/sentinel.conf
    depends_on:
      - redis-master
      - redis-replica-1
      - redis-replica-2
    networks:
      redis-sentinel:
        ipv4_address: 172.23.0.22

  sentinel-3:
    image: redis:7-alpine
    container_name: redis-sentinel-3
    command: >
      redis-sentinel /usr/local/etc/redis/sentinel.conf
    ports:
      - "26381:26379"
    volumes:
      - ./sentinel/sentinel3/sentinel.conf:/usr/local/etc/redis/sentinel.conf
    depends_on:
      - redis-master
      - redis-replica-1
      - redis-replica-2
    networks:
      redis-sentinel:
        ipv4_address: 172.23.0.23

networks:
  redis-sentinel:
    driver: bridge
    ipam:
      config:
        - subnet: 172.23.0.0/24
