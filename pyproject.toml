[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wredis"
version = "1.0.3"
authors = [{ name = "wisrovi", email = "wisrovi.rodriguez@gmail.com" }]
description = "Redis control with Python - Async support, decorators, and high availability"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries",
    "Intended Audience :: Developers",
]
dependencies = [
    "redis>=5.0.0",
    "loguru>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "fakeredis>=2.21.0",
    "mypy>=1.8.0",
    "ruff>=0.15.0",
]
docs = [
    "sphinx>=8.0.0",
    "furo>=2024.0.0",
    "sphinx-copybutton>=0.5.0",
    "myst-parser>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/wisrovi/wredis"
"Bug Tracker" = "https://github.com/wisrovi/wredis/issues"

[tool.hatch.build.targets.wheel]
packages = ["wredis"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["wredis"]
branch = true
omit = [
    "wredis/_connection.py",
    "wredis/_types.py",
    "wredis/__init__.py",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_empty = true
fail_under = 95
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "except:",
    "logger.error",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = false
warn_no_return = true
follow_imports = "skip"
ignore_missing_imports = true
disable_error_code = ["arg-type", "no-any-return", "union-attr", "misc"]

[tool.ruff]
extend = ".ruff.toml"
